<!doctype html>
<html lang="es-AR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0f1316">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f1316'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Cinzel,Georgia,serif' font-weight='700' font-size='24' fill='%2319e0cf'%3EG%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geologica:CRSV,SHRP,wght@0..1,0..100,100..900&family=JetBrains+Mono:wght@400..800&display=swap"

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="css/gradina.css" rel="stylesheet">
</head>

<body class="landing">
  <a class="skip-link" href="#consulta">Ir a contacto</a>



  <main class="stage">
    <section class="stone">
      <div class="stone-rock">
        <div class="stone-body">
          <h1>acompañamiento tecnológico.</h1>
          <div class="hero-notes">
            <p class="hero-lead">
              <span class="lead-pre">Asistencia técnica a emprendimientos, comercios y proyectos.</span>
              <span class="lead-main"><span class="prompt" aria-hidden="true">&gt;</span> delegá asuntos digitales
                mientras te ocupás de tu proyecto.</span>
            </p>
          </div>
        </div>
      </div>
      <a class="wordmark" href="index.html" aria-label="Gradina, inicio"><span><span
            class="wordmark-g">G</span>radina</span></a>
      <a class="nav-capsule" href="nosotros.html" aria-label="Más información">[&nbsp;+&nbsp;info&nbsp;<span
          class="cursor" aria-hidden="true">_</span>&nbsp;]</a>
      <span class="pixels" aria-hidden="true"></span>
    </section>

    <section class="digital" id="consulta" aria-labelledby="consulta-titulo">
      <h2 id="consulta-titulo" class="prompt-title"><span class="prompt-sign" aria-hidden="true">&gt;</span> ¿Qué
        necesitás?<span class="cursor" aria-hidden="true">_</span></h2>
      <div class="digital-actions">
        <a class="btn-g btn-g--lg btn-g--accent" data-wa="Hola, quiero hacer una consulta." href="#">
          <i class="bi bi-whatsapp" aria-hidden="true"></i> Escribinos por WhatsApp
        </a>
        <div class="row-2">
          <div class="traces" aria-hidden="true">
            <span class="trace trace--v"></span>
            <span class="trace trace--h"></span>
            <span class="node"></span>
          </div>
          <a class="btn-g btn-g--soft" data-email href="#">
            <i class="bi bi-envelope" aria-hidden="true"></i> Email
          </a>
          <a class="btn-g btn-g--soft" data-instagram href="#">
            <i class="bi bi-instagram" aria-hidden="true"></i> Instagram
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
